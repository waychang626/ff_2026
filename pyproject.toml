[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ffdraft"
version = "0.1.0"
description = "Deterministic draft engine for season-long fantasy football"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "PyYAML>=6.0"]

[project.optional-dependencies]
fetch = ["requests>=2.28"]
llm = ["anthropic>=0.40"]
dev = ["pytest>=7.0"]

[project.scripts]
ffdraft = "ffdraft.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]
